<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figma plugin test bench</title>
<!--
  Try the plugin without Figma: open http://localhost:5173/figma-plugin/dev.html
  while python3 serve.py is running. A small stand-in for Figma's plugin API
  runs code.js, and ui.html is loaded the way Figma loads it (an inline page
  in a sandboxed iframe, with no origin of its own). The "canvas" on the left
  shows the frames and the mockups the plugin places.
-->
<style>
  body { margin: 0; display: flex; height: 100vh; font: 12px/1.4 -apple-system, system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
  .canvas { flex: 1; position: relative; overflow: auto; background: #2a2a2a; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1e1e1e; border-bottom: 1px solid #333; }
  .bar button { background: #333; color: #ddd; border: 1px solid #444; border-radius: 5px; padding: 5px 10px; cursor: pointer; }
  .world { position: relative; transform-origin: 0 0; }
  .node { position: absolute; outline: 1px solid transparent; cursor: pointer; background-size: 100% 100%; }
  .node.sel { outline: 2px solid #0d99ff; }
  .node .name { position: absolute; top: -18px; left: 0; color: #999; white-space: nowrap; font-size: 11px; }
  .panel { width: 320px; border-left: 1px solid #333; display: flex; flex-direction: column; }
  .panel iframe { border: 0; width: 320px; height: 736px; background: #2c2c2c; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #000; color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #toast.error { background: #a32; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bar">
      <button id="edit">Change the selected frame's design</button>
      <button id="none">Select nothing</button>
      <span id="log"></span>
    </div>
    <div class="world" id="world"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div id="toast"></div>

<script type="module">
const SCALE = 0.4; // how big the fake canvas is drawn
const world = document.getElementById('world');
world.style.transform = `scale(${SCALE})`;
world.style.width = '6000px';
world.style.height = '3000px';

// ---------------------------------------------------------------------------
// A stand-in for the parts of Figma's plugin API that code.js uses
// ---------------------------------------------------------------------------
const nodes = new Map();
const images = new Map();
const listeners = { selectionchange: [] };
let nextId = 1;
let iframe = null;

class FakeNode {
  constructor(type, props) {
    Object.assign(this, { type, x: 0, y: 0, width: 100, height: 100, name: type, fills: [], removed: false }, props);
    this.id = `${nextId++}:1`;
    this.pluginData = {};
    nodes.set(this.id, this);
  }
  getPluginData(k) { return this.pluginData[k] || ''; }
  setPluginData(k, v) { this.pluginData[k] = v; }
  setRelaunchData(d) { this.relaunch = d; }
  resize(w, h) { this.width = w; this.height = h; }
  get absoluteBoundingBox() { return { x: this.x, y: this.y, width: this.width, height: this.height }; }
  async exportAsync({ constraint }) {
    const k = constraint.value;
    const c = new OffscreenCanvas(Math.round(this.width * k), Math.round(this.height * k));
    drawDesign(c.getContext('2d'), c.width, c.height, this);
    return new Uint8Array(await (await c.convertToBlob({ type: 'image/png' })).arrayBuffer());
  }
}

let selection = [];
const page = {
  children: [],
  get selection() { return selection; },
  set selection(v) { selection = v; draw(); listeners.selectionchange.forEach((f) => f()); },
  appendChild(n) { this.children.push(n); },
  findAll(fn) { return this.children.filter(fn); },
  findAllWithCriteria({ pluginData }) { return this.children.filter((n) => pluginData.keys.some((k) => n.getPluginData(k))); },
};

const figma = window.figma = {
  command: new URLSearchParams(location.search).get('command') || '',
  currentPage: page,
  ui: {
    onmessage: null,
    postMessage(msg) { iframe.contentWindow.postMessage({ pluginMessage: msg }, '*'); },
  },
  showUI(html, opts) {
    iframe = document.createElement('iframe');
    // Figma's panel has no origin of its own ('allow-scripts' alone). This
    // page gives it one: browsers that block pages with no origin from
    // reaching localhost (Chrome's local network protection) would otherwise
    // load the renderer from GitHub instead of this computer.
    iframe.sandbox = new URLSearchParams(location.search).has('null-origin') ? 'allow-scripts' : 'allow-scripts allow-same-origin';
    iframe.srcdoc = html;
    iframe.style.height = `${opts.height}px`;
    document.getElementById('panel').appendChild(iframe);
  },
  on(ev, fn) { listeners[ev].push(fn); },
  async getNodeByIdAsync(id) { return nodes.get(id) || null; },
  createImage(bytes) {
    const hash = `img${images.size + 1}`;
    images.set(hash, URL.createObjectURL(new Blob([bytes], { type: 'image/png' })));
    return { hash };
  },
  createRectangle() { return new FakeNode('RECTANGLE', { name: 'Rectangle' }); },
  clientStorage: {
    store: {},
    async getAsync(k) { return this.store[k]; },
    async setAsync(k, v) { this.store[k] = v; },
  },
  viewport: { scrollAndZoomIntoView() {} },
  notify(text, opts = {}) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = `on${opts.error ? ' error' : ''}`;
    clearTimeout(t.timer);
    t.timer = setTimeout(() => { t.className = ''; }, 2500);
    log(`notify: ${text}`);
  },
  closePlugin() { log('closePlugin'); },
  openExternal(url) { log(`openExternal: ${url}`); },
};

window.addEventListener('message', (e) => {
  if (iframe && e.source === iframe.contentWindow && e.data?.pluginMessage) {
    figma.ui.onmessage?.(e.data.pluginMessage);
    draw();
  }
});

// ---------------------------------------------------------------------------
// Some frames to mock up
// ---------------------------------------------------------------------------
function drawDesign(g, w, h, node) {
  const v = node.version || 1;
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, v % 2 ? '#5b3fd1' : '#d13f6b');
  grad.addColorStop(1, v % 2 ? '#0e0f1a' : '#1a0e12');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff';
  g.font = `600 ${Math.round(w * 0.09)}px -apple-system, system-ui`;
  g.fillText(node.name, w * 0.08, h * 0.16);
  g.font = `${Math.round(w * 0.05)}px -apple-system, system-ui`;
  g.fillText(`Version ${v}`, w * 0.08, h * 0.16 + w * 0.08);
  for (let i = 0; i < 4; i++) {
    g.fillStyle = 'rgba(255,255,255,0.12)';
    g.beginPath();
    g.roundRect(w * 0.08, h * (0.3 + i * 0.15), w * 0.84, h * 0.11, w * 0.04);
    g.fill();
  }
}

const home = new FakeNode('FRAME', { name: 'Home', x: 100, y: 200, width: 390, height: 844 });
const dash = new FakeNode('FRAME', { name: 'Dashboard', x: 100, y: 1300, width: 1194, height: 834 });
page.appendChild(home);
page.appendChild(dash);

// ---------------------------------------------------------------------------
// Drawing the fake canvas
// ---------------------------------------------------------------------------
const thumbs = new Map();
async function frameThumb(n) {
  const key = `${n.id}:${n.version || 1}`;
  if (!thumbs.has(key)) {
    const c = new OffscreenCanvas(Math.round(n.width), Math.round(n.height));
    drawDesign(c.getContext('2d'), c.width, c.height, n);
    thumbs.set(key, URL.createObjectURL(await c.convertToBlob()));
  }
  return thumbs.get(key);
}

async function draw() {
  world.innerHTML = '';
  for (const n of page.children) {
    const el = document.createElement('div');
    el.className = `node${selection.includes(n) ? ' sel' : ''}`;
    Object.assign(el.style, { left: `${n.x}px`, top: `${n.y}px`, width: `${n.width}px`, height: `${n.height}px` });
    const fill = n.fills.find((f) => f.type === 'IMAGE');
    el.style.backgroundImage = `url(${fill ? images.get(fill.imageHash) : await frameThumb(n)})`;
    el.innerHTML = `<span class="name" style="font-size:${11 / SCALE}px;top:${-18 / SCALE}px">${n.name}</span>`;
    el.onclick = (e) => { e.stopPropagation(); page.selection = [n]; };
    world.appendChild(el);
  }
}

function log(text) {
  document.getElementById('log').textContent = text;
  console.log('[figma]', text);
}

document.getElementById('edit').onclick = () => {
  const n = selection[0];
  if (!n || n.fills.length) return log('Select a frame first');
  n.version = (n.version || 1) + 1;
  draw();
  log(`${n.name} is now version ${n.version}`);
};
document.getElementById('none').onclick = () => { page.selection = []; };

// ---------------------------------------------------------------------------
// Run the plugin
// ---------------------------------------------------------------------------
const [code, html] = await Promise.all(['code.js', 'ui.html'].map((f) => fetch(f, { cache: 'no-store' }).then((r) => r.text())));
draw();
page.selection = [home];
new Function('figma', '__html__', code)(figma, html);
</script>
</body>
</html>
